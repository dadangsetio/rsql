name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.x.x)"
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    env:
      # Rolling the editor and the ANTLR SQL grammar into a bundle needs more
      # than the ~2 GB a runner defaults to, and the failure is an out-of-memory
      # crash rather than anything that names itself.
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust targets
        if: matrix.platform == 'macos-latest'
        # Run where rust-toolchain.toml applies: from the repository root
        # rustup adds the targets to the runner's default toolchain, not to the
        # pinned one the build actually uses, and the cross build then fails
        # with "target is not installed".
        working-directory: src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev gnupg rpm

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Version consistency
        run: node scripts/check-version.mjs

      - name: Resolve release tag
        id: release_meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi

          case "$tag" in
            v*) ;;
            *)
              echo "Release tag must start with v, got: $tag"
              exit 1
              ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Detect signing configuration
        id: sign_check
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_RPM_KEY: ${{ secrets.TAURI_SIGNING_RPM_KEY }}
          TAURI_SIGNING_RPM_KEY_PASSPHRASE: ${{ secrets.TAURI_SIGNING_RPM_KEY_PASSPHRASE }}
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.APPIMAGETOOL_SIGN_PASSPHRASE }}
        run: |
          # ponytail: no secrets configured yet -> build unsigned artifacts instead of failing the run
          has_updater=false
          if [ -n "$TAURI_UPDATER_PUBLIC_KEY" ] && [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            has_updater=true
          else
            echo "::warning::Updater signing secrets missing, building without updater artifacts."
          fi
          echo "has_updater=$has_updater" >> "$GITHUB_OUTPUT"

          has_windows_cert=false
          if [ "$PLATFORM" = "windows-latest" ]; then
            if [ -n "$WINDOWS_CERTIFICATE" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
              has_windows_cert=true
            else
              echo "::warning::Windows signing secrets missing, building unsigned exe/msi."
            fi
          fi
          echo "has_windows_cert=$has_windows_cert" >> "$GITHUB_OUTPUT"

          has_linux_signing=false
          if [ "$PLATFORM" = "ubuntu-22.04" ]; then
            if [ -n "$TAURI_SIGNING_RPM_KEY" ] && [ -n "$APPIMAGETOOL_SIGN_PASSPHRASE" ]; then
              if printf '%s' "$TAURI_SIGNING_RPM_KEY" | gpg --batch --dearmor > /dev/null 2>&1; then
                has_linux_signing=true
                # ponytail: tauri's rpm bundler signs whenever this env var is merely *set*,
                # even to an empty string, so only export it when it's actually usable.
                echo "TAURI_SIGNING_RPM_KEY<<RPM_KEY_EOF" >> "$GITHUB_ENV"
                printf '%s\n' "$TAURI_SIGNING_RPM_KEY" >> "$GITHUB_ENV"
                echo "RPM_KEY_EOF" >> "$GITHUB_ENV"
                echo "TAURI_SIGNING_RPM_KEY_PASSPHRASE=${TAURI_SIGNING_RPM_KEY_PASSPHRASE:-}" >> "$GITHUB_ENV"
              else
                echo "::warning::TAURI_SIGNING_RPM_KEY is not a valid ASCII-armored PGP key, building unsigned AppImage/RPM."
              fi
            else
              echo "::warning::Linux signing secrets missing, building unsigned AppImage/RPM."
            fi
          fi
          echo "has_linux_signing=$has_linux_signing" >> "$GITHUB_OUTPUT"

      - name: Inject updater public key into Tauri config
        if: steps.sign_check.outputs.has_updater == 'true'
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node -e 'const fs=require("fs"); const path="src-tauri/tauri.conf.json"; const config=JSON.parse(fs.readFileSync(path,"utf8")); config.plugins ??= {}; config.plugins.updater ??= {}; config.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBLIC_KEY; fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");'

      - name: Disable updater artifact signing
        if: steps.sign_check.outputs.has_updater == 'false'
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const path="src-tauri/tauri.conf.json"; const config=JSON.parse(fs.readFileSync(path,"utf8")); config.bundle ??= {}; config.bundle.createUpdaterArtifacts = false; fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");'

      - name: Import Windows signing certificate
        if: matrix.platform == 'windows-latest' && steps.sign_check.outputs.has_windows_cert == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE -NoNewline
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx | Out-Null
          Remove-Item -Path certificate/tempCert.txt

          $certificate = Import-PfxCertificate `
            -FilePath certificate/certificate.pfx `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)

          if (-not $certificate) {
            Write-Error "Failed to import Windows signing certificate."
            exit 1
          }

          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Windows signing
        if: matrix.platform == 'windows-latest' && steps.sign_check.outputs.has_windows_cert == 'true'
        shell: pwsh
        env:
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content -Path $configPath -Raw | ConvertFrom-Json
          $timestampUrl = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }

          if (-not $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            Write-Error "Missing imported Windows certificate thumbprint."
            exit 1
          }

          if (-not $config.bundle) {
            $config | Add-Member -NotePropertyName bundle -NotePropertyValue ([PSCustomObject]@{})
          }

          if (-not $config.bundle.PSObject.Properties["windows"]) {
            $config.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([PSCustomObject]@{})
          }

          $config.bundle.windows = [PSCustomObject]@{
            certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
            digestAlgorithm = "sha256"
            timestampUrl = $timestampUrl
          }

          $config | ConvertTo-Json -Depth 100 | Set-Content -Path $configPath -Encoding utf8NoBOM

      - name: Import Linux signing key (AppImage + RPM)
        if: matrix.platform == 'ubuntu-22.04' && steps.sign_check.outputs.has_linux_signing == 'true'
        env:
          TAURI_SIGNING_RPM_KEY: ${{ secrets.TAURI_SIGNING_RPM_KEY }}
        run: |
          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"
          printf '%s' "${TAURI_SIGNING_RPM_KEY}" | gpg --batch --import

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          SIGN: ${{ steps.sign_check.outputs.has_linux_signing == 'true' && '1' || '' }}
          APPIMAGETOOL_FORCE_SIGN: ${{ steps.sign_check.outputs.has_linux_signing == 'true' && '1' || '' }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.APPIMAGETOOL_SIGN_PASSPHRASE }}
          # TAURI_SIGNING_RPM_KEY(_PASSPHRASE) intentionally not set here: the RPM bundler
          # signs whenever the var is merely present, even empty, so "Detect signing
          # configuration" exports it via $GITHUB_ENV only when it's actually valid.
        with:
          tagName: ${{ steps.release_meta.outputs.tag }}
          releaseName: "RSQL ${{ steps.release_meta.outputs.tag }}"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: ${{ contains(steps.release_meta.outputs.tag, '-rc') }}
          args: ${{ matrix.args }}
          tauriScript: npx tauri
